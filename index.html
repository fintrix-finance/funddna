<style>

.brk{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}.brk div{border-top:1px solid var(--ink);padding-top:12px}

.sec>*,.fpw>*,.idn>*,.fin>*{min-width:0}footer{padding:0 0 44px;font-size:12px;color:var(--mute)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ins{display:grid;gap:0}.hl{border-top:1px solid var(--ink);padding:18px 0 26px}.hl .hh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}.hl h3{font:400 28px/1.1 var(--serif);letter-spacing:-.01em}.hl .hh .lbl{margin:0}
.hq{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 36px}.hq p{font-size:15px;margin-bottom:6px}.hq>div:last-child{grid-column:1/-1}
.srcs{white-space:normal}.src{font:italic 14px var(--serif);color:var(--mute);text-decoration:underline;text-decoration-color:var(--soft);text-underline-offset:3px;margin-left:8px}.src:hover{color:var(--ink)}
.stamp a{color:var(--mute)}.pf3{display:grid;grid-template-columns:1fr;gap:30px}.pf3 h3{font:400 22px var(--serif);margin-bottom:8px}.pf3 table{min-width:0}.pf3 th:nth-child(4),.pf3 td:nth-child(4){text-align:right}
table.lt th,table.lt td{text-align:left}.fig b.sm{font-size:clamp(24px,2.9vw,38px);white-space:nowrap}
@media(max-width:860px){.hq{grid-template-columns:1fr}.hl h3{font-size:24px}.w{padding:0 20px}nav,.rt span:first-child{display:none}.hd{gap:14px}.idn,.sec,.fpw,.two,.fin{grid-template-columns:1fr;gap:26px}.sec{padding:32px 0 40px}
.chg3,.brk{grid-template-columns:1fr;gap:22px}.rk,.mg{grid-template-columns:repeat(2,1fr)}.fp text{display:none}
.tm{height:auto}.tr{flex-wrap:wrap;flex:none!important}.tr:first-child{height:180px}.tr+.tr .blk{flex:1 1 calc(33.33% - 2px)!important;height:104px}.blk{padding:9px 10px}.blk b{font-size:24px}
.sg b{font-size:26px}.sg span{font-size:11px}.mc b{font-size:24px}
table{font-size:13px}th,td{padding-left:8px;padding-right:8px}th:first-child,td:first-child{position:sticky;left:0;background:var(--paper);z-index:1;box-shadow:1px 0 0 var(--soft)}tbody tr:hover td:first-child{background:#E4DFD0}.tw{margin-right:-20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){.fp g.b path{animation:none;stroke-dashoffset:0}*{transition:none!important}}
</style></head><body>
<header><div class="w hd">
<a class="logo" href="#top">fund<b>DNA</b></a>
<nav><a href="#top">Research</a><a href="#ctx">Compare</a><a href="#top" title="Not in this build">Watchlist</a></nav>
<div class="srch"><input id="q" placeholder="Search funds" autocomplete="off" aria-label="Search funds"><ul id="res"></ul></div>
<div class="rt"><span id="mk"></span><span class="av" title="Profile">MR</span></div></div></header>
<main id="app"></main>
<script>
/* ===== DATA LAYER — live API. The UI renders only from D (same shape as the original mock). ===== */
const API=(document.querySelector('meta[name=funddna-api]')||{}).content||'';
const D={asOf:'',dims:['Return','Momentum','Stability','Resilience','Concentration','Large-cap','Equity','Breadth'],
 dimDefs:['3Y annualised return vs the index','6M return','Lower NAV volatility scores higher','Smaller 3Y max drawdown scores higher','Top-10 holdings weight','Large-cap share of researched holdings (approx.)','Equity share of the portfolio','Spread across sectors (1 − top sector weight)'],
 bench:[],cat:null,refs:{bench:{name:'Index'}},funds:{},analysis:{}};
const clamp=v=>Math.max(3,Math.min(97,Math.round(v)));
function toUI(x){
 const st=x.stats||{},b=x.bench||{},bs=b.stats||{},eq=x.holdings.filter(h=>h.type==='EQUITY');
 const topSec=(x.sectors.find(s=>!/Cash|Debt/.test(s[0]))||['—',0]);
 const large=x.mcap?x.mcap[0]:null;
 const dna=[clamp(50+3*((st.r3??0)-(bs.r3??0))),clamp(50+3*(st.r6m??0)),clamp(100-(st.vol??20)*4),clamp(100+(st.dd??-25)*2.5),clamp((x.top10||0)*1.6),clamp(large??50),clamp(x.equityShare||0),clamp(100-topSec[1]*1.5)];
 const lv=v=>v>=70?4:v>=50?3:2;
 const tv=x.turnover==null?null:x.turnover<30?1:x.turnover<70?3:5;
 const profile=[[`${topSec[0]}-heavy`,lv(topSec[1]*2)],[large==null?'Market-cap mix unknown':large>=60?'Large-cap tilted':large>=35?'Multi-cap mix':'Mid/small-cap tilted',large==null?1:lv(large)],[(x.top10>=50?'High':x.top10>=35?'Moderate':'Low')+' concentration',lv(dna[4])],[tv==null?'Turnover n/a':(tv===1?'Low':tv===3?'Moderate':'High')+' turnover',tv??1],[(st.vol>=16?'High':st.vol>=11?'Medium':'Low')+' volatility',st.vol>=16?5:st.vol>=11?3:2],[(st.r3??0)>=(bs.r3??0)?'Ahead of index (3Y)':'Behind index (3Y)',(st.r3??0)>=(bs.r3??0)?4:2]];
 const mg=x.managers||[],since=mg.map(m=>m.since).filter(Boolean).sort()[0];
 const yrs=since?((Date.now()-new Date(since))/3.156e10).toFixed(1)+' years':'—';
 return {code:x.code,name:x.name,plan:x.plan,nav:x.nav,aum:x.aum,navDate:x.navDate,portfolioDate:x.portfolioDate,sources:x.sources,coverage:x.coverage,
  stats:{r1:st.r1,r3:st.r3,vol:st.vol,beta:st.beta,sharpe:st.sharpe,dd:st.dd,er:x.er,top10:x.top10,large},
  benchStats:{r1:bs.r1,r3:bs.r3,vol:bs.vol,beta:1,sharpe:bs.r3!=null&&bs.vol?(bs.r3-6.5)/bs.vol:null,dd:bs.dd,er:null,top10:null,large:null},benchName:b.name||'Index',benchUrl:b.url,
  series:x.series,benchSeries:b.series||[],notes:[],dna,profile,sectors:x.sectors.map(s=>[s[0],s[1],null]),mcap:x.mcap,
  book:eq.slice(0,10).map(h=>[h.name,h.weight,h.sector,h.returns?h.returns['1M']:null,h.returns?h.returns['3M']:null,null]),
  holdings:x.holdings,mgr:{name:mg.map(m=>m.name).join(', ')||'—',tenure:yrs,count:x.holdingsCount,turn:x.turnover!=null?x.turnover+'%':'—'}};
}
async function getJ(u){const r=await fetch(u);const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
/* ===== RENDERING ===== */
const $=s=>document.querySelector(s);let ids=[];
let cur=null,peer=null,per=5,pper='3M';
const inr=n=>n==null?'—':n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=(n,d=1)=>n==null||isNaN(n)?'—':(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(d)+'%';
const cl=n=>n>0?'pos':n<0?'neg':'';
const ql=i=>{const e=D.asOfDate||new Date(),d=new Date(e.getFullYear(),e.getMonth()-3*(20-i),1);return d.toLocaleString('en-US',{month:'short'})+' ’'+String(d.getFullYear()).slice(2)};
function fpBands(sc,W,H,N,step){
 const nb=sc.length,bw=W/nb,q=H/300;
 const s=x=>{let t=Math.min(nb-1,Math.max(0,x/bw-.5)),i=Math.floor(t),j=Math.min(nb-1,i+1),u=t-i;u=u*u*(3-2*u);return sc[i]+(sc[j]-sc[i])*u};
 const y=(x,k)=>{const a=s(x);return 14+k*(H-28)/(N-1)+(2+a*10)*q*Math.sin(x/(34-a*20)+k*.55)+(1.5+a*4)*q*Math.sin(x/11-k*.9)};
 return sc.map((_,b)=>{let o='';for(let k=0;k<N;k++){const m=Math.round(bw/step);let d='';for(let i=0;i<=m;i++){const x=b*bw+bw*i/m;d+=(i?'L':'M')+x.toFixed(1)+' '+y(x,k).toFixed(1)}o+=`<path ${k%7==3?'class="a" ':''}pathLength="1" d="${d}" style="animation-delay:${k*35}ms"/>`}return o});
}
function fpSVG(f){
 const sc=f.dna.map(v=>v/100),b=fpBands(sc,1000,400,32,4),bw=125;
 return `<svg class="fp" id="fp" viewBox="0 0 1000 430" role="img" aria-label="Fund fingerprint across eight dimensions">${b.map((p,i)=>`<g class="b" data-i="${i}">${p}<text x="${i*bw+bw/2}" y="424">${D.dims[i]}</text><rect x="${i*bw}" y="0" width="${bw}" height="430" fill="transparent"/></g>`).join('')}</svg>`;
}
function chartHTML(){
 const f=D.funds[cur],n=per*4+1,s=21-n;
 const S=[['Fund',f.series,'#14130E',2.6,''],['Index',f.benchSeries,'#77746A',1.6,'']].filter(x=>x[1]&&x[1].length===21&&x[1].every(v=>v!=null)).map(([l,a,c,w,d])=>{const v=a.slice(s);return{l,c,w,d,v:v.map(x=>x/v[0]*100)}});
 const all=S.flatMap(x=>x.v),mn=Math.floor(Math.min(...all)/5)*5-3,mx=Math.ceil(Math.max(...all)/5)*5+3;
 const M=innerWidth<700,W=M?520:900,H=380,L=4,R=M?64:150,T=40,B=28,X=i=>L+i*(W-L-R)/(n-1),Y=v=>T+(mx-v)*(H-T-B)/(mx-mn),st=Math.ceil((n-1)/6);
 let g='';for(let k=0;k<=4;k++){const v=mn+k*(mx-mn)/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#CFCABB"/><text x="${L}" y="${Y(v)-5}" font-size="${M?15:11}" fill="#77746A">${v>=100?'+':'−'}${Math.abs(Math.round(v-100))}%</text>`}
 for(let i=0;i<n;i+=st)g+=`<text x="${X(i)}" y="${H-6}" font-size="${M?15:11}" fill="#77746A" text-anchor="${i?'middle':'start'}">${ql(s+i)}</text>`;
 const gap=M?18:16,ly=S.map((x,k)=>({k,y:Y(x.v[n-1])+4})).sort((a,b)=>a.y-b.y);for(let k=1;k<ly.length;k++)ly[k].y=Math.max(ly[k].y,ly[k-1].y+gap);const lyk={};ly.forEach(o=>lyk[o.k]=o.y);
 S.forEach((x,k)=>{g+=`<path d="${x.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')}" fill="none" stroke="${x.c}" stroke-width="${x.w}" stroke-dasharray="${x.d}"/>`;const e=x.v[n-1];g+=`<text x="${W-R+10}" y="${lyk[k]}" font-size="${M?15:12}" font-weight="600" fill="${x.c}">${M?'':x.l+' '}${sg(e-100,1)}</text>`});
 g+=f.notes.filter(a=>a.i>=s).map((a,k)=>{const x=X(a.i-s),y=Y(S[0].v[a.i-s]),up=k%2?1:-1,ty=y+up*30,ax=x>W-R-100?'end':x<90?'start':'middle';return`<g class="an"><line x1="${x}" x2="${x}" y1="${y}" y2="${ty-up*10}" stroke="#14130E" stroke-width=".8"/><circle cx="${x}" cy="${y}" r="5"/><text x="${x}" y="${ty}" style="text-anchor:${ax};font-size:${M?15:12}px">${a.t}</text></g>`}).join('');
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rebased performance chart">${g}</svg>`;
}
function ddHTML(f){
 const fs=innerWidth<700?32:12,s=f.series;let m=0;const d=s.map(v=>(m=Math.max(m,v),v/m-1)),mn=Math.min(...d)*1.15,W=900,H=innerWidth<700?190:150,X=i=>i*W/20,Y=v=>12+v/mn*(H-(innerWidth<700?56:34)),k=d.indexOf(Math.min(...d));
 const p=d.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Drawdown timeline"><path d="${p}L${W} 12L0 12Z" fill="#A3453A" opacity=".16"/><path d="${p}" fill="none" stroke="#A3453A" stroke-width="1.8"/><line x1="0" x2="${W}" y1="12" y2="12" stroke="#14130E"/><circle cx="${X(k)}" cy="${Y(d[k])}" r="4" fill="#A3453A"/><text x="${X(k)+10}" y="${Y(d[k])+4}" font-size="${fs}" fill="#A3453A">Deepest point, ${ql(k)}</text><text x="0" y="${H-4}" font-size="${fs}" fill="#77746A">${ql(0)}</text><text x="${W}" y="${H-4}" font-size="${fs}" fill="#77746A" text-anchor="end">${ql(20)}</text></svg>`;
}
function mapHTML(f){

 const row=r=>`<div class="tr" style="flex:${sum(r)}">${r.map(x=>{const t=Math.min(100,22+x[1]*3.4);return`<div class="blk${x[1]<2.5?' xs':''}" data-n="${x[0]}" data-w="${x[1]}" data-b="${x[2]}" title="${x[0]} ${x[1].toFixed(1)}%" style="flex:${x[1]};background:color-mix(in srgb,#14130E ${t}%,#EEEADF);color:${t>52?'#EEEADF':'#14130E'}"><span>${x[0]}</span><b>${x[1].toFixed(1)}%</b></div>`}).join('')}</div>`;

function cmpHTML(){

 const v=(o,k,u)=>o&&o[k]!=null?(+o[k]).toFixed(['sharpe','er','beta'].includes(k)?2:1).replace('-','−')+u:'—';

const sec=(t,sub,body,id='')=>`<div class="w"><section class="sec" ${id?`id="${id}"`:''}><div><h2>${t}</h2><p class="sub">${sub}</p></div><div>${body}</div></section></div>`;

const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function srcLinks(ids,A){const m={};(A.sources||[]).forEach(x=>m[x.id]=x);return ids.map(i=>m[i]).filter(Boolean).map(x=>`<a class="src" href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.title)}">${esc(x.publisher||'Source')}${x.date?', '+new Date(x.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):''}</a>`).join('')}
function claims(list,A,empty){return list&&list.length?list.map(c=>`<p>${esc(c.text)} <span class="srcs">${srcLinks(c.src,A)}</span></p>`).join(''):`<p class="mut">${empty}</p>`}
function insideHTML(f){

 if(!A||A.loading)return `<p class="note mut">Researching the largest holdings: filings, results, investor presentations and news. This takes about a minute the first time.</p>`;
 if(A.failed)return `<p class="note">Research could not finish: ${esc(A.failed)}. Holdings, returns and risk below are still live.</p>`;
 if(!A.holdings||!A.holdings.length)return `<p class="note">${esc(A.error||'No analysis returned.')}</p>`;
 return `<div class="ins">${A.holdings.map(h=>{const r=h.returns||{};return `<article class="hl"><div class="hh"><h3>${esc(nm(h.name))}</h3><p class="lbl">${h.weight!=null?h.weight.toFixed(1)+'% of fund':''}${h.sector?' · '+esc(h.sector):''}${r['3M']!=null?` · 3M <span class="${cl(r['3M'])}">${sg(r['3M'])}</span>`:''}</p></div>
 <div class="hq"><div><p class="lbl">What changed</p>${claims(h.what_changed,A,'No sourced development found in the last 30 days.')}</div>
 <div><p class="lbl">What the market expected</p>${claims(h.expected,A,'No reliable consensus source found.')}</div>
 <div><p class="lbl">What we’re seeing</p>${claims(h.seeing,A,'Not enough sourced data to compare expectation with reality.')}</div>
 <div><p class="lbl">Why it matters to this fund</p><p>${esc(h.why_it_matters||'')}</p></div>
 <div><p class="lbl">What to watch</p>${claims(h.watch,A,'No sourced catalyst found.')}</div></div></article>`}).join('')}</div>
 <p class="cap">Every claim links to its source. Reasoning by ${esc(A.model||'Gemini')} from the cited material only${A.grounded?'':'; web search for consensus was unavailable on this run'}. Generated ${new Date(A.generatedAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}.</p>`;

function perfHTML(f){
 const rows=f.holdings.filter(h=>h.type==='EQUITY'&&h.returns&&h.returns[pper]!=null).map(h=>({n:nm(h.name),w:h.weight,r:h.returns[pper],s:h.sector,c:h.weight*h.returns[pper]/100}));
 const t=(title,list,col)=>`<div><h3>${title}</h3><div class="tw"><table class="bk"><thead><tr><th>STOCK</th><th>FUND WEIGHT</th><th>RETURN</th><th>${col==='c'?'CONTRIBUTION (EST.)':'SECTOR'}</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.w.toFixed(1)}%</td><td class="${cl(x.r)}">${sg(x.r)}</td><td class="${col==='c'?cl(x.c):''}">${col==='c'?(x.c>=0?'+':'−')+Math.abs(x.c).toFixed(2)+' pts':esc(x.s)}</td></tr>`).join('')||'<tr><td colspan="4">No data</td></tr>'}</tbody></table></div></div>`;
 const byR=[...rows].sort((a,b)=>b.r-a.r),byC=[...rows].sort((a,b)=>b.c-a.c);

 <p class="cap">Price returns for the ${rows.length} largest equity holdings with price data (${f.coverage}% of the fund). Contribution is estimated as fund weight × stock return; weights are as of ${f.portfolioDate}, so moves since then are not reflected.</p>`;

function wholeHTML(){

 return `<div class="two" style="margin-top:0"><div><p class="lbl">What is driving the fund</p>${claims(P.drivers,A,'—')}</div><div><p class="lbl">Where expectations may be priced in</p>${claims(P.priced_in,A,'No sourced view on valuation expectations.')}</div></div>

 $('#app').innerHTML=`

 ${sec('Where the money is','Sector exposure, sized by weight',`${mapHTML(f)}${f.mcap?`<p class="lbl" style="margin-top:30px">Market cap (approx., largest holdings)</p><div class="mc">${['Large','Mid','Small'].map((n,i)=>`<div style="flex:${Math.max(f.mcap[i],4)}"><b>${f.mcap[i]}%</b><span>${n}</span></div>`).join('')}</div>`:''}`)}
 ${sec('The book','Largest positions and recent moves',`<div class="tw"><table class="bk"><thead><tr><th>COMPANY</th><th>WEIGHT</th><th>SECTOR</th><th>1M</th><th>3M</th></tr></thead><tbody>${bk.map(r=>`<tr><td>${esc(nm(r[0]))}</td><td>${r[1].toFixed(1)}%</td><td>${esc(r[2])}</td><td class="${cl(r[3])}">${sg(r[3])}</td><td class="${cl(r[4])}">${sg(r[4])}</td></tr>`).join('')}</tbody></table></div><p class="cap">Month-on-month position changes appear once two monthly disclosures have been captured.</p>`)}
 ${sec('Where it can hurt','Risk in the numbers',`<div class="rk"><div><b>${st.vol!=null?st.vol.toFixed(1)+'%':'—'}</b><span>Volatility (3Y)</span></div><div><b>${st.beta!=null?st.beta.toFixed(2):'—'}</b><span>Beta vs index</span></div><div><b class="neg">${sg(st.dd)}</b><span>Maximum drawdown (3Y)</span></div><div><b>${st.sharpe!=null?st.sharpe.toFixed(2):'—'}</b><span>Sharpe (rf 6.5%)</span></div></div><p class="note">${P.risk_note?esc(P.risk_note):wait}</p>${ddHTML(f)}<p class="cap">Drawdown from prior peak, quarter-end NAV observations.</p>`)}

const app=$('#app');

const q=$('#q'),res=$('#res');
async function load(code){
 code=String(code);cur=code;q.value='';res.style.display='none';location.hash=code;
 if(!D.funds[code]){$('#app').innerHTML=`<div class="w"><section class="idn"><div><h1 class="mut">Loading fund…</h1><p class="stamp">Fetching holdings, NAV history and prices.</p></div></section></div>`;
  try{const x=await getJ(`${API}/api/fund?code=${code}`);D.funds[code]=toUI(x);D.asOfDate=new Date(x.seriesEnd||Date.now());if(!ids.includes(code))ids.push(code);try{localStorage.setItem('fd_recent',JSON.stringify(ids.slice(-6)))}catch(e){}}
  catch(e){$('#app').innerHTML=`<div class="w"><section class="idn"><div><h1>Couldn’t load this fund</h1><p class="stamp">${esc(e.message)}. Holdings may not be published for this scheme (e.g. some debt, FoF or closed schemes).</p></div></section></div>`;return}}
 if(cur!==code)return;render();scrollTo(0,0);
 if(!D.analysis[code]){D.analysis[code]={loading:true};
  (async()=>{let a=null;try{a=await getJ(`data/analysis/${code}.json`)}catch(e){}
   if(!a){try{a=await getJ(`${API}/api/analysis?code=${code}`)}catch(e){a={failed:e.message}}}
   D.analysis[code]=a;if(cur===code)render()})();}
}
const pick=id=>load(id);
let qt;q.addEventListener('input',()=>{clearTimeout(qt);const t=q.value.trim();if(t.length<2){res.style.display='none';return}

 res.innerHTML=r.results.map(x=>`<li data-id="${x.code}">${esc(x.name)}<span class="mut" style="display:block;font-size:12px">${esc(x.amc)} · ${esc(x.category)}</span></li>`).join('')||'<li>No fund matches</li>'}catch(e){res.innerHTML=`<li>Search unavailable</li>`}res.style.display='block'},220)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const l=res.querySelector('li[data-id]');if(l)pick(l.dataset.id)}});

(()=>{const i=new Date(Date.now()+(new Date().getTimezoneOffset()+330)*6e4),m=i.getHours()*60+i.getMinutes(),o=i.getDay()%6&&m>=555&&m<930;$('#mk').innerHTML=`<i class="dot ${o?'o':''}"></i>NSE ${o?'open':'closed'}`})();
addEventListener('resize',()=>{const c=$('#chart');if(c&&D.funds[cur])c.innerHTML=chartHTML()});
load((location.hash.slice(1).match(/^\d+$/)||[])[0]||'118955');
