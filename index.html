 for(let i=0;i<n;i+=st)g+=`<text x="${X(i)}" y="${H-6}" font-size="${M?15:11}" fill="#77746A" text-anchor="${i?'middle':'start'}">${ql(s+i)}</text>`;
 S.forEach(x=>{g+=`<path d="${x.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')}" fill="none" stroke="${x.c}" stroke-width="${x.w}" stroke-dasharray="${x.d}"/>`;const e=x.v[n-1];g+=`<text x="${W-R+10}" y="${Y(e)+4}" font-size="${M?15:12}" font-weight="600" fill="${x.c}">${M?'':x.l+' '}${sg(e-100,1)}</text>`});
 g+=f.notes.filter(a=>a.i>=s).map((a,k)=>{const x=X(a.i-s),y=Y(S[0].v[a.i-s]),up=k%2?1:-1,ty=y+up*30,ax=x>W-R-100?'end':x<90?'start':'middle';return`<g class="an"><line x1="${x}" x2="${x}" y1="${y}" y2="${ty-up*10}" stroke="#14130E" stroke-width=".8"/><circle cx="${x}" cy="${y}" r="5"/><text x="${x}" y="${ty}" style="text-anchor:${ax};font-size:${M?15:12}px">${a.t}</text></g>`}).join('');
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rebased performance chart">${g}</svg>`;
}
function ddHTML(f){
 const fs=innerWidth<700?20:12,s=f.series;let m=0;const d=s.map(v=>(m=Math.max(m,v),v/m-1)),mn=Math.min(...d)*1.15,W=900,H=150,X=i=>i*W/20,Y=v=>12+v/mn*(H-34),k=d.indexOf(Math.min(...d));
 const p=d.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Drawdown timeline"><path d="${p}L${W} 12L0 12Z" fill="#A3453A" opacity=".16"/><path d="${p}" fill="none" stroke="#A3453A" stroke-width="1.8"/><line x1="0" x2="${W}" y1="12" y2="12" stroke="#14130E"/><circle cx="${X(k)}" cy="${Y(d[k])}" r="4" fill="#A3453A"/><text x="${X(k)+10}" y="${Y(d[k])+4}" font-size="${fs}" fill="#A3453A">Deepest point, ${ql(k)}</text><text x="0" y="${H-4}" font-size="${fs}" fill="#77746A">${ql(0)}</text><text x="${W}" y="${H-4}" font-size="${fs}" fill="#77746A" text-anchor="end">${ql(20)}</text></svg>`;
}
function mapHTML(f){
 const a=[...f.sectors].sort((x,y)=>y[1]-x[1]),r1=a.slice(0,3),r2=a.slice(3),sum=r=>r.reduce((t,x)=>t+x[1],0);
 const row=r=>`<div class="tr" style="flex:${sum(r)}">${r.map(x=>{const t=Math.min(100,22+x[1]*3.4);return`<div class="blk" data-n="${x[0]}" data-w="${x[1]}" data-b="${x[2]}" style="flex:${x[1]};background:color-mix(in srgb,#14130E ${t}%,#EEEADF);color:${t>52?'#EEEADF':'#14130E'}"><span>${x[0]}</span><b>${x[1].toFixed(1)}%</b></div>`}).join('')}</div>`;
 return `<div class="tm">${row(r1)}${row(r2)}</div><div id="mapr">Hover a block to compare with the benchmark.</div>`;
}
function cmpHTML(){
 const f=D.funds[cur],p=D.funds[peer],c=[['1Y return','r1','%'],['3Y annualised','r3','%'],['Volatility','vol','%'],['Beta','beta',''],['Sharpe','sharpe',''],['Max drawdown','dd','%'],['Expense ratio','er','%'],['Top-10 weight','top10','%'],['Large-cap share','large','%']];
 const v=(o,k,u)=>o[k].toFixed(['sharpe','er','beta'].includes(k)?2:1).replace('-','−')+u;
 return `<div class="tw"><table class="cmp"><thead><tr><th></th><th>${f.name}</th><th>${D.refs.cat.name}</th><th>${D.refs.bench.name}</th><th><select id="peer" aria-label="Peer fund">${ids.filter(i=>i!==cur).map(i=>`<option value="${i}" ${i===peer?'selected':''}>${D.funds[i].name}</option>`).join('')}</select></th></tr></thead><tbody>${c.map(([l,k,u])=>`<tr><td>${l}</td><td>${v(f.stats,k,u)}</td><td>${v(D.refs.cat,k,u)}</td><td>${v(D.refs.bench,k,u)}</td><td>${v(p.stats,k,u)}</td></tr>`).join('')}</tbody></table></div>`;
}
const sec=(t,sub,body,id='')=>`<div class="w"><section class="sec" ${id?`id="${id}"`:''}><div><h2>${t}</h2><p class="sub">${sub}</p></div><div>${body}</div></section></div>`;
function render(){
 if(peer===cur)peer=ids.find(i=>i!==cur);
 const f=D.funds[cur],st=f.stats,bk=f.book,fmt=r=>`<p><span>${r[0]}</span><span class="${cl(r[5])}">${sg(r[5],1)}</span></p>`;
 const add=bk.filter(r=>r[6]),inc=bk.filter(r=>!r[6]&&r[5]>0),red=bk.filter(r=>r[5]<0);
 $('#app').innerHTML=`
 <div class="w"><section id="top" class="idn"><div><h1>${f.name}</h1><p class="plan">${f.plan}</p><p class="stamp">Updated ${D.asOf} · Mock data</p></div>
 <div class="fig"><div><b>₹${inr(f.nav)}</b><span>NAV</span></div><div><b class="${cl(st.r1)}">${sg(st.r1,2)}</b><span>1Y</span></div><div><b>₹${f.aum.toLocaleString('en-IN')} Cr</b><span>AUM</span></div><div><b>${st.er.toFixed(2)}%</b><span>EXPENSE RATIO</span></div></div></section></div>
 <div class="dark"><div class="w"><section class="sec"><div><h2>The DNA</h2><p class="sub">Eight measured traits, drawn as one pattern. Each fund produces its own.</p></div>
 <div class="fpw"><div>${fpSVG(f)}<div id="fpr" class="mut">Hover or tap a band to read the trait.</div></div>
 <div class="pf"><h3>DNA profile</h3><ul class="pf">${f.profile.map(([l,n])=>`<li>${l}<i>${[1,2,3,4,5].map(k=>`<s class="${k<=n?'f':''}"></s>`).join('')}</i></li>`).join('')}</ul></div></div></section></div></div>
 ${sec('What is this fund really?','The analyst’s read',`<p class="big">${f.statement}</p><div class="two"><div><p class="lbl">FundDNA interpretation</p><p>${f.interp[0]}</p></div><p style="align-self:end">${f.interp[1]}</p></div>`)}
 ${sec('Performance','Where the return came from',`<div class="pb" role="group" aria-label="Period">${[1,3,5].map(y=>`<button data-y="${y}" aria-pressed="${y===per}">${y}Y</button>`).join('')}</div><div id="chart">${chartHTML()}</div><div class="leg"><span><i style="border-color:#14130E"></i>Fund</span><span><i style="border-color:#77746A"></i>Benchmark</span><span><i style="border-color:#A8A392;border-top-style:dashed"></i>Category</span><span>Rebased to 0 at period start · quarter-end points</span></div>`)}
 ${sec('What is driving returns?','Attribution of the 5-year return',`<div class="drv">${f.drivers.map((v,i)=>`<div class="sg" style="flex:${v}"><i style="background:${['#C8E23A','#14130E','#77746A','#B8B3A3'][i]}"></i><b>${v}%</b><span>${D.driverNames[i]}</span></div>`).join('')}</div>`)}
 ${sec('Where the money is','Sector exposure, sized by weight',`${mapHTML(f)}<p class="lbl" style="margin-top:30px">Market cap</p><div class="mc">${['Large','Mid','Small'].map((n,i)=>`<div style="flex:${f.mcap[i]}"><b>${f.mcap[i]}%</b><span>${n}</span></div>`).join('')}</div>`)}
 ${sec('The book','Largest positions and recent moves',`<div class="tw"><table class="bk"><thead><tr><th>COMPANY</th><th>WEIGHT</th><th>SECTOR</th><th>1M</th><th>3M</th><th>POSITION CHANGE</th></tr></thead><tbody>${bk.map(r=>`<tr title="${(r[1]-r[5]).toFixed(1)}% → ${r[1].toFixed(1)}% of assets"><td>${r[0]}${r[6]?' <span class="mut" style="font-size:11px">new</span>':''}</td><td>${r[1].toFixed(1)}%</td><td>${r[2]}</td><td class="${cl(r[3])}">${sg(r[3])}</td><td class="${cl(r[4])}">${sg(r[4])}</td><td class="${cl(r[5])}">${r[5]>0?'↑':'↓'} ${sg(r[5])}</td></tr>`).join('')}</tbody></table></div>`)}
 ${sec('What changed','Portfolio activity this month',`<div class="chg3"><div><h3>Added</h3>${add.map(fmt).join('')||'<p>None</p>'}</div><div><h3>Increased</h3>${inc.map(fmt).join('')||'<p>None</p>'}</div><div><h3>Reduced</h3>${red.map(fmt).join('')||'<p>None</p>'}</div></div>`)}
 ${sec('Where it can hurt','Risk in the numbers',`<div class="rk"><div><b>${st.vol.toFixed(1)}%</b><span>Volatility</span></div><div><b>${st.beta.toFixed(2)}</b><span>Beta</span></div><div><b class="neg">${sg(st.dd)}</b><span>Maximum drawdown</span></div><div><b>${st.sharpe.toFixed(2)}</b><span>Sharpe</span></div></div><p class="note">${f.riskNote}</p>${ddHTML(f)}<p class="cap">Drawdown from prior peak, quarter-end observations.</p>`)}
 ${sec('What could break the thesis?','Three things to watch',`<div class="brk">${f.risks.map((r,i)=>`<div><b>0${i+1}</b><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('')}</div>`)}
 ${sec('Who is running the money?','',`<dl class="mg"><div><dt>Manager</dt><dd>${f.mgr.name}</dd></div><div><dt>Fund tenure</dt><dd>${f.mgr.tenure}</dd></div><div><dt>Experience</dt><dd>${f.mgr.exp}</dd></div><div><dt>Portfolio turnover</dt><dd>${f.mgr.turn}</dd></div></dl>`)}
 ${sec('Put it in context','Same measures, side by side',`<div id="cmp">${cmpHTML()}</div>`,'ctx')}
 <div class="w"><section class="fin"><div><h2>The fund, in one line</h2><p class="big">${f.line}</p><p class="pl"><span>DNA profile</span>${f.profile.slice(0,4).map(p=>p[0]).join(' · ')}</p></div>
 <svg class="fp" viewBox="0 0 600 300" aria-hidden="true">${fpBands(f.dna.map(v=>v/100),600,300,24,6).map(p=>`<g class="b">${p}</g>`).join('')}</svg></section><footer>Mock data for interface development. Not investment advice.</footer></div>`;
}
/* ===== INTERACTION ===== */
const app=$('#app');
app.addEventListener('mouseover',e=>{
 const b=e.target.closest('.fp g[data-i]'),k=e.target.closest('.blk');
 if(b){const fp=$('#fp'),i=+b.dataset.i,v=D.funds[cur].dna[i];fp.classList.add('h');fp.querySelectorAll('g.b').forEach(g=>g.classList.toggle('on',g===b));$('#fpr').innerHTML=`<b>${D.dims[i]} ${v}</b>${v>=70?'High':v>=50?'Moderate':'Low'} relative to the category`}
 if(k){const d=(k.dataset.w-k.dataset.b).toFixed(1);$('#mapr').textContent=`${k.dataset.n}: ${k.dataset.w}% of assets · benchmark ${k.dataset.b}% · ${d>0?'+':d<0?'−':''}${Math.abs(d)} pts`}
});
app.addEventListener('mouseout',e=>{if(e.target.closest('#fp')&&!e.relatedTarget?.closest?.('#fp')){const fp=$('#fp');fp.classList.remove('h');fp.querySelectorAll('g.b').forEach(g=>g.classList.remove('on'));$('#fpr').textContent='Hover or tap a band to read the trait.'}});
app.addEventListener('click',e=>{const b=e.target.closest('.pb button');if(!b)return;per=+b.dataset.y;$('#chart').innerHTML=chartHTML();app.querySelectorAll('.pb button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
app.addEventListener('change',e=>{if(e.target.id==='peer'){peer=e.target.value;$('#cmp').innerHTML=cmpHTML()}});
const q=$('#q'),res=$('#res');
const pick=id=>{cur=id;q.value='';res.style.display='none';render();scrollTo(0,0)};
q.addEventListener('input',()=>{const t=q.value.trim().toLowerCase(),m=ids.filter(i=>D.funds[i].name.toLowerCase().includes(t));res.innerHTML=m.map(i=>`<li data-id="${i}">${D.funds[i].name}</li>`).join('')||'<li>No fund matches</li>';res.style.display=t?'block':'none'});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const l=res.querySelector('li[data-id]');if(l)pick(l.dataset.id)}});
res.addEventListener('click',e=>{const l=e.target.closest('li[data-id]');if(l)pick(l.dataset.id)});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))res.style.display='none'});
(()=>{const i=new Date(Date.now()+(new Date().getTimezoneOffset()+330)*6e4),m=i.getHours()*60+i.getMinutes(),o=i.getDay()%6&&m>=555&&m<930;$('#mk').innerHTML=`<i class="dot ${o?'o':''}"></i>NSE ${o?'open':'closed'}`})();
addEventListener('resize',()=>{const c=$('#chart');if(c)c.innerHTML=chartHTML()});render();
</script></body></html>
