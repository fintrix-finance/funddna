name: Material-change scan and prebuild
on:
  schedule:
    - cron: '40 8 * * *'   # 14:10 IST: cheap signal scan; Gemini only for material changes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build analysis JSON for popular funds
        id: build
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: node scripts/prebuild.js
      - name: Commit data
        if: always()
        run: |
          git config user.name "funddna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly data $(date -u +%F)"
          git pull --rebase
          git push
      - name: Confirm analyses exist and material triggers completed
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const funds = ['118955','122639','120166','118989','120503','119598'];
          const missing = funds.filter(c => { try { const a = JSON.parse(fs.readFileSync(`data/analysis/${c}.json`)); return !a.holdings?.length || !a.portfolio; } catch { return true; } });
          console.log(`Valid analyses: ${funds.length - missing.length}/${funds.length}; missing: ${missing.join(',') || 'none'}. Analysis dates are intentionally not checked: unchanged funds stay valid.`);
          if (missing.length || process.env.BUILD_OUTCOME === 'failure') process.exitCode = 1;
          NODE
      - name: Propagate material-trigger failure
        if: steps.build.outcome == 'failure'
        run: exit 1
