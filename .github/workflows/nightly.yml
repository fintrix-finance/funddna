name: Material-change scan and prebuild
on:
  schedule:
    - cron: '40 8 * * *'   # 14:10 IST: cheap signal scan; Gemini only for material changes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan universe and backfill a bounded analysis batch
        id: build
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DAILY_GEMINI_CAP: 8
          DAILY_SCAN_COUNT: 20
        run: node scripts/prebuild.js
      - name: Commit data
        if: always()
        run: |
          git config user.name "funddna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly data $(date -u +%F)"
          git pull --rebase
          git push
      - name: Report published coverage
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/backfill-state.json';
          if (fs.existsSync(p)) {
            const s = JSON.parse(fs.readFileSync(p));
            console.log(`Written analysis: ${s.completed}/${s.total}; checked ${s.scanned}; Gemini attempts ${s.attempts}; published ${s.published}; quota stop: ${s.quotaStopped}`);
            for (const f of s.failures || []) console.log(`Skipped ${f.code}: ${f.error}`);
          } else console.log('Backfill state not written.');
          NODE
