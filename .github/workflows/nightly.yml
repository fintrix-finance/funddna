name: Nightly prebuild
on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build analysis JSON for popular funds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/prebuild.js
      - name: Commit data
        run: |
          git config user.name "funddna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Nightly data $(date -u +%F)"
          git push
